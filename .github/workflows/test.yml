name: test
on: [ push, pull_request ]

jobs:
  test:
    name: Test / ${{ matrix.os }} / Go ${{ matrix.go }}

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        go: [ '1.25', '1.26', '1.27', 'stable' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Test
        run: go test -v ./...
